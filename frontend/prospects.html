<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospects - ColdGenius AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen" x-data="prospectsApp()">
    <!-- Toast Container akan di-insert otomatis oleh toast.js -->

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="campaigns.html" class="text-gray-500 hover:text-gray-900 flex items-center text-sm font-semibold transition">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                Back to Campaigns
            </a>
            <div class="h-6 w-px bg-gray-300 mx-2"></div>
            <div>
                <h1 class="text-xl font-bold text-gray-900" x-text="'Campaign #' + campaignId"></h1>
                <p class="text-xs text-gray-500">Prospect Management</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button @click="showModal = true" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition flex items-center shadow-sm hover:shadow-md">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Prospect
            </button>
            <button @click="logout" class="text-sm text-red-600 hover:text-red-800 font-semibold">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-8 max-w-7xl mx-auto">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-900">Prospects List</h3>
                <span class="text-sm text-gray-500" x-text="prospects.length + ' prospects'"></span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                        <tr>
                            <th class="px-6 py-3">Name</th>
                            <th class="px-6 py-3">Email & Validation</th>
                            <th class="px-6 py-3">AI Email Status</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        <template x-if="loading">
                            <tr>
                                <td colspan="4" class="px-6 py-12 text-center">
                                    <div class="flex flex-col items-center justify-center">
                                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-3"></div>
                                        <p class="text-gray-500 text-sm">Loading prospects...</p>
                                    </div>
                                </td>
                            </tr>
                        </template>
                        <template x-if="!loading && prospects.length === 0">
                            <tr>
                                <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                                    <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                    </svg>
                                    <p>No prospects yet. Add your first one!</p>
                                </td>
                            </tr>
                        </template>
                        <template x-for="prospect in prospects" :key="prospect.id">
                            <tr class="hover:bg-gray-50 transition">
                                <td class="px-6 py-4">
                                    <div class="font-medium text-gray-900" x-text="prospect.full_name"></div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-gray-900 text-sm" x-text="prospect.email"></div>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium mt-1"
                                          :class="{
                                              'bg-green-100 text-green-800': prospect.validation_status === 'valid',
                                              'bg-yellow-100 text-yellow-800': prospect.validation_status === 'risky',
                                              'bg-red-100 text-red-800': prospect.validation_status === 'invalid'
                                          }"
                                          x-text="prospect.validation_status.toUpperCase()"></span>
                                </td>
                                <td class="px-6 py-4">
                                    <template x-if="prospect.email_status === 'sent'">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                            <svg class="w-3 h-3 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                                            Sent
                                        </span>
                                    </template>
                                    <template x-if="prospect.email_status === 'draft'">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
                                            <svg class="w-3 h-3 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4zm3 1h2v2H7V5zm2 4H7v2h2V9zm2-4h2v2h-2V5zm2 4h-2v2h2V9z" clip-rule="evenodd"></path></svg>
                                            Draft Ready
                                        </span>
                                    </template>
                                    <template x-if="!prospect.email_status">
                                        <span class="text-gray-400 text-xs italic">Not generated</span>
                                    </template>
                                </td>
                                <td class="px-6 py-4 text-right space-x-2">
                                    <template x-if="!prospect.email_status">
                                        <button @click="generateEmail(prospect.id)" :disabled="prospect.generating" 
                                            class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-md text-indigo-700 bg-indigo-100 hover:bg-indigo-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                            <svg x-show="!prospect.generating" class="w-3.5 h-3.5 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
                                            <div x-show="prospect.generating" class="animate-spin h-3.5 w-3.5 mr-1.5 border-2 border-indigo-700 border-t-transparent rounded-full"></div>
                                            <span x-text="prospect.generating ? 'Generating...' : '✨ Generate AI'"></span>
                                        </button>
                                    </template>
                                    <template x-if="prospect.email_status === 'draft'">
                                        <button @click="confirmSendEmail(prospect.id)" :disabled="prospect.sending" 
                                            class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-md text-green-700 bg-green-100 hover:bg-green-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                            <svg x-show="!prospect.sending" class="w-3.5 h-3.5 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path></svg>
                                            <div x-show="prospect.sending" class="animate-spin h-3.5 w-3.5 mr-1.5 border-2 border-green-700 border-t-transparent rounded-full"></div>
                                            <span x-text="prospect.sending ? 'Sending...' : '📤 Send Email'"></span>
                                        </button>
                                    </template>
                                    <template x-if="prospect.email_status === 'sent'">
                                        <button @click="timestampEmail(prospect.id, prospect.email_id)" 
                                            :disabled="prospect.timestamping || prospect.timestamped" 
                                            class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-md text-purple-700 bg-purple-100 hover:bg-purple-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                            <svg x-show="!prospect.timestamping && !prospect.timestamped" class="w-3.5 h-3.5 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                                            <div x-show="prospect.timestamping" class="animate-spin h-3.5 w-3.5 mr-1.5 border-2 border-purple-700 border-t-transparent rounded-full"></div>
                                            <svg x-show="prospect.timestamped" class="w-3.5 h-3.5 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                                            <span x-text="prospect.timestamping ? 'Timestamping...' : (prospect.timestamped ? '✅ Timestamped' : '⛓️ Web3')"></span>
                                        </button>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Prospect Modal -->
    <div x-show="showModal" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         class="fixed inset-0 z-50 overflow-y-auto" 
         style="display: none;">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" @click="showModal = false"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Add New Prospect</h3>
                            <form @submit.prevent="addProspect">
                                <div class="grid grid-cols-2 gap-4 mb-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
                                        <input type="text" x-model="newProspect.full_name" required class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="John Doe">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address <span class="text-red-500">*</span></label>
                                        <input type="email" x-model="newProspect.email" required class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="john@company.com">
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Personal Points <span class="text-gray-400 text-xs">(comma separated)</span></label>
                                    <input type="text" x-model="newProspect.personal_points_str" class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="e.g., CTO, Spoke at SaaStr">
                                </div>
                                <div class="mb-6">
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Pain Points <span class="text-gray-400 text-xs">(comma separated)</span></label>
                                    <input type="text" x-model="newProspect.pain_points_str" class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="e.g., Hiring, Scaling outbound">
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" @click="addProspect" :disabled="adding" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        <span x-show="!adding">Add Prospect</span>
                        <div x-show="adding" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full mr-2"></div>
                        <span x-show="adding">Adding...</span>
                    </button>
                    <button type="button" @click="showModal = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Dialog for Send Email -->
    <div x-show="showConfirmDialog" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         class="fixed inset-0 z-50 overflow-y-auto" 
         style="display: none;">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" @click="showConfirmDialog = false"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-green-100 sm:mx-0 sm:h-10 sm:w-10">
                            <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                            <h3 class="text-lg leading-6 font-medium text-gray-900">Send Email</h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500">Are you sure you want to send this email to <span class="font-semibold text-gray-700" x-text="confirmEmail"></span>? This action cannot be undone.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" @click="confirmSendEmailAction" :disabled="sending" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-green-600 text-base font-medium text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50">
                        <span x-show="!sending">Yes, Send Email</span>
                        <div x-show="sending" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full mr-2"></div>
                        <span x-show="sending">Sending...</span>
                    </button>
                    <button type="button" @click="showConfirmDialog = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Email Preview Modal -->
    <div x-show="showPreviewModal" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         class="fixed inset-0 z-50 overflow-y-auto" 
         style="display: none;">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" @click="showPreviewModal = false"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Email Preview</h3>
                            <div class="bg-gray-50 rounded-lg p-4 mb-4">
                                <div class="mb-3">
                                    <span class="text-xs font-semibold text-gray-500 uppercase">Subject:</span>
                                    <p class="text-sm font-medium text-gray-900 mt-1" x-text="previewEmail?.subject || 'Loading...'"></p>
                                </div>
                                <div>
                                    <span class="text-xs font-semibold text-gray-500 uppercase">Body:</span>
                                    <div class="text-sm text-gray-700 mt-1 whitespace-pre-line" x-text="previewEmail?.body || 'Loading...'" style="white-space: pre-wrap;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" @click="showPreviewModal = false" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/toast.js"></script>
    <script>
        function prospectsApp() {
            return {
                campaignId: new URLSearchParams(window.location.search).get('campaign') || 1,
                prospects: [],
                loading: true,
                showModal: false,
                adding: false,
                showConfirmDialog: false,
                showPreviewModal: false,
                confirmEmail: '',
                confirmProspectId: null,
                sending: false,
                previewEmail: null,
                newProspect: { full_name: '', email: '', personal_points_str: '', pain_points_str: '' },

                async init() {
                    const token = localStorage.getItem('token');
                    if (!token) { 
                        window.location.href = 'login.html'; 
                        return; 
                    }
                    await this.fetchProspects(token);
                },

                async fetchProspects(token) {
                    try {
                        const res = await fetch(`http://127.0.0.1:8000/campaigns/${this.campaignId}/prospects`, { 
                            headers: { 'Authorization': `Bearer ${token}` } 
                        });
                        if (res.status === 401) { 
                            localStorage.removeItem('token'); 
                            window.location.href = 'login.html'; 
                            return; 
                        }
                        const data = await res.json();
                        // Tambahkan state lokal untuk tracking tombol
                        this.prospects = data.map(p => ({ 
                            ...p, 
                            generating: false, 
                            sending: false, 
                            timestamping: false, 
                            timestamped: false, 
                            email_status: null 
                        }));
                    } catch (e) { 
                        console.error(e);
                        toast.error('Failed to load prospects');
                    }
                    finally { 
                        this.loading = false; 
                    }
                },

                async addProspect() {
                    this.adding = true;
                    const token = localStorage.getItem('token');
                    const payload = {
                        full_name: this.newProspect.full_name,
                        email: this.newProspect.email,
                        personal_points: this.newProspect.personal_points_str.split(',').map(s => s.trim()).filter(s => s),
                        pain_points: this.newProspect.pain_points_str.split(',').map(s => s.trim()).filter(s => s)
                    };
                    try {
                        const res = await fetch(`http://127.0.0.1:8000/campaigns/${this.campaignId}/prospects`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            this.showModal = false;
                            this.newProspect = { full_name: '', email: '', personal_points_str: '', pain_points_str: '' };
                            await this.fetchProspects(token);
                            toast.success('Prospect added successfully!');
                        } else {
                            const err = await res.json();
                            toast.error('Failed: ' + (err.detail || 'Unknown error'));
                        }
                    } catch (e) { 
                        console.error(e);
                        toast.error('Network error. Please try again.');
                    }
                    finally { 
                        this.adding = false; 
                    }
                },

                async generateEmail(prospectId) {
                    const p = this.prospects.find(x => x.id === prospectId);
                    p.generating = true;
                    const token = localStorage.getItem('token');
                    try {
                        toast.info('Generating AI email...');
                        const res = await fetch(`http://127.0.0.1:8000/campaigns/${this.campaignId}/prospects/${prospectId}/generate-email`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) {
                            const data = await res.json();
                            p.email_status = data.status; // 'draft'
                            p.email_id = data.id;
                            p.preview_subject = data.subject;
                            p.preview_body = data.body;
                            toast.success('AI email generated successfully!');
                        } else {
                            const err = await res.json();
                            toast.error('Failed to generate: ' + (err.detail || 'Unknown error'));
                        }
                    } catch (e) { 
                        console.error(e);
                        toast.error('Network error. Please try again.');
                    }
                    finally { 
                        p.generating = false; 
                    }
                },

                confirmSendEmail(prospectId) {
                    const p = this.prospects.find(x => x.id === prospectId);
                    this.confirmEmail = p.email;
                    this.confirmProspectId = prospectId;
                    this.previewEmail = {
                        subject: p.preview_subject || 'Email Subject',
                        body: p.preview_body || 'Email Body'
                    };
                    this.showConfirmDialog = true;
                },

                async confirmSendEmailAction() {
                    if (!this.confirmProspectId) return;
                    
                    this.sending = true;
                    this.showConfirmDialog = false;
                    const p = this.prospects.find(x => x.id === this.confirmProspectId);
                    p.sending = true;
                    const token = localStorage.getItem('token');
                    
                    try {
                        const res = await fetch(`http://127.0.0.1:8000/campaigns/${this.campaignId}/prospects/${this.confirmProspectId}/send-email`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) {
                            const data = await res.json();
                            p.email_status = data.status; // 'sent'
                            toast.success('Email sent successfully! Check your inbox.');
                        } else {
                            const err = await res.json();
                            toast.error('Failed to send: ' + (err.detail || 'Unknown error'));
                        }
                    } catch (e) { 
                        console.error(e);
                        toast.error('Network error. Please try again.');
                    }
                    finally { 
                        p.sending = false;
                        this.sending = false;
                        this.confirmProspectId = null;
                    }
                },

                async timestampEmail(prospectId, emailId) {
                    const p = this.prospects.find(x => x.id === prospectId);
                    p.timestamping = true;
                    const token = localStorage.getItem('token');
                    try {
                        toast.info('Timestamping on blockchain...');
                        const res = await fetch(`http://127.0.0.1:8000/campaigns/${this.campaignId}/prospects/${prospectId}/emails/${emailId}/timestamp`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) {
                            p.timestamped = true;
                            toast.success('Email timestamped on blockchain!');
                        } else {
                            const err = await res.json();
                            toast.error('Failed: ' + (err.detail || 'Unknown error'));
                        }
                    } catch (e) { 
                        console.error(e);
                        toast.error('Network error. Please try again.');
                    }
                    finally { 
                        p.timestamping = false; 
                    }
                },

                logout() {
                    localStorage.removeItem('token');
                    toast.info('Logged out successfully');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 500);
                }
            }
        }
    </script>
</body>
</html>
