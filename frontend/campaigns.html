<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaigns - ColdGenius AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen" x-data="campaignsApp()">
    <!-- Top Navigation -->
    <nav class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center hover:bg-indigo-700 transition">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </a>
            <div>
                <h1 class="text-xl font-bold text-gray-900">ColdGenius AI</h1>
                <p class="text-xs text-gray-500">Campaign Management</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button @click="showModal = true" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition flex items-center shadow-sm hover:shadow-md">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                New Campaign
            </button>
            <button @click="logout" class="text-sm text-red-600 hover:text-red-800 font-semibold">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-8 max-w-7xl mx-auto">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Campaigns</h2>
            <p class="text-gray-600 mt-1">Manage and track your email campaigns</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-900">All Campaigns</h3>
                <span class="text-sm text-gray-500" x-text="campaigns.length + ' campaigns'"></span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                        <tr>
                            <th class="px-6 py-3">ID</th>
                            <th class="px-6 py-3">Campaign Name</th>
                            <th class="px-6 py-3">Status</th>
                            <th class="px-6 py-3">Created At</th>
                            <th class="px-6 py-3">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        <template x-if="loading">
                            <tr>
                                <td colspan="5" class="px-6 py-12 text-center">
                                    <div class="flex flex-col items-center justify-center">
                                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-3"></div>
                                        <p class="text-gray-500 text-sm">Loading campaigns...</p>
                                    </div>
                                </td>
                            </tr>
                        </template>
                        <template x-if="!loading && campaigns.length === 0">
                            <tr>
                                <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                                    <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                                    </svg>
                                    <p>No campaigns yet. Create your first one!</p>
                                </td>
                            </tr>
                        </template>
                        <template x-for="campaign in campaigns" :key="campaign.id">
                            <tr class="hover:bg-gray-50 transition">
                                <td class="px-6 py-4 text-gray-500" x-text="campaign.id"></td>
                                <td class="px-6 py-4 font-medium text-gray-900" x-text="campaign.name"></td>
                                <td class="px-6 py-4">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" 
                                          :class="campaign.status === 'draft' ? 'bg-gray-100 text-gray-700' : 'bg-green-100 text-green-700'" 
                                          x-text="campaign.status"></span>
                                </td>
                                <td class="px-6 py-4 text-gray-500" x-text="new Date(campaign.created_at).toLocaleDateString()"></td>
                                <td class="px-6 py-4">
                                    <a :href="'prospects.html?campaign=' + campaign.id" class="text-indigo-600 hover:text-indigo-800 font-semibold text-sm inline-flex items-center">
                                        Manage Prospects
                                        <svg class="w-3 h-3 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                                    </a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create Campaign Modal -->
    <div x-show="showModal" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         class="fixed inset-0 z-50 overflow-y-auto" 
         style="display: none;">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" @click="showModal = false"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-indigo-100 sm:mx-0 sm:h-10 sm:w-10">
                            <svg class="h-6 w-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        </div>
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900">Create New Campaign</h3>
                            <div class="mt-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Campaign Name <span class="text-red-500">*</span></label>
                                <input type="text" x-model="newCampaignName" required class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="e.g., Q4 SaaS Outreach">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" @click="createCampaign" :disabled="creating" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        <span x-show="!creating">Create Campaign</span>
                        <div x-show="creating" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full mr-2"></div>
                        <span x-show="creating">Creating...</span>
                    </button>
                    <button type="button" @click="showModal = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/toast.js"></script>
    <script>
        function campaignsApp() {
            return {
                campaigns: [],
                loading: true,
                showModal: false,
                newCampaignName: '',
                creating: false,

                async init() {
                    const token = localStorage.getItem('token');
                    if (!token) { 
                        window.location.href = 'login.html'; 
                        return; 
                    }
                    await this.fetchCampaigns(token);
                },

                async fetchCampaigns(token) {
                    try {
                        const res = await fetch('http://127.0.0.1:8000/campaigns', { 
                            headers: { 'Authorization': `Bearer ${token}` } 
                        });
                        if (res.status === 401) { 
                            localStorage.removeItem('token'); 
                            window.location.href = 'login.html'; 
                            return; 
                        }
                        this.campaigns = await res.json();
                    } catch (e) { 
                        console.error(e);
                        toast.error('Failed to load campaigns');
                    }
                    finally { 
                        this.loading = false; 
                    }
                },

                async createCampaign() {
                    this.creating = true;
                    const token = localStorage.getItem('token');
                    try {
                        const res = await fetch('http://127.0.0.1:8000/campaigns', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                            body: JSON.stringify({ name: this.newCampaignName, status: 'draft' })
                        });
                        if (res.ok) {
                            this.showModal = false;
                            this.newCampaignName = '';
                            await this.fetchCampaigns(token);
                            toast.success('Campaign created successfully!');
                        } else {
                            const err = await res.json();
                            toast.error('Failed: ' + (err.detail || 'Unknown error'));
                        }
                    } catch (e) { 
                        console.error(e);
                        toast.error('Network error. Please try again.');
                    }
                    finally { 
                        this.creating = false; 
                    }
                },

                logout() {
                    localStorage.removeItem('token');
                    toast.info('Logged out successfully');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 500);
                }
            }
        }
    </script>
</body>
</html>
