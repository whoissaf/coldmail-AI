<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ColdGenius AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-4" x-data="loginApp()">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 mb-4 shadow-lg">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">ColdGenius AI</h1>
                <p class="text-gray-600 mt-2">Sign in to your account</p>
            </div>
            
            <form @submit.prevent="login" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input 
                        type="email" 
                        x-model="email" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition outline-none"
                        placeholder="you@company.com"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input 
                        type="password" 
                        x-model="password" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition outline-none"
                        placeholder="••••••••"
                    >
                </div>
                
                <div x-show="error" x-transition class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm flex items-center">
                    <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    <span x-text="error"></span>
                </div>
                
                <button 
                    type="submit" 
                    :disabled="loading"
                    class="w-full btn-primary text-white font-semibold py-3 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center transition-all shadow-md hover:shadow-lg"
                >
                    <span x-show="!loading">Sign In</span>
                    <div x-show="loading" class="flex items-center">
                        <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></div>
                        Signing in...
                    </div>
                </button>
            </form>
            
            <div class="mt-6 text-center text-sm text-gray-600">
                Don't have an account? 
                <a href="#" class="text-indigo-600 hover:text-indigo-700 font-semibold">Contact admin</a>
            </div>
        </div>
        
        <p class="text-center text-xs text-gray-500 mt-6">
            © 2026 ColdGenius AI. All rights reserved.
        </p>
    </div>
    
    <script src="assets/js/toast.js"></script>
    <script>
        function loginApp() {
            return {
                email: '',
                password: '',
                loading: false,
                error: '',
                
                async login() {
                    this.loading = true;
                    this.error = '';
                    
                    try {
                        const response = await fetch('http://127.0.0.1:8000/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: this.email,
                                password: this.password
                            })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok) {
                            localStorage.setItem('token', data.access_token);
                            toast.success('Login successful! Redirecting...');
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 800);
                        } else {
                            this.error = data.detail || 'Invalid email or password';
                            toast.error(this.error);
                        }
                    } catch (error) {
                        this.error = 'Cannot connect to backend. Please ensure the server is running.';
                        toast.error(this.error);
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
