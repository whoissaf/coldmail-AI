<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ColdGenius AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen" x-data="dashboardApp()">
    <!-- Top Navigation -->
    <nav class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-900">ColdGenius AI</h1>
                <p class="text-xs text-gray-500">Dashboard</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <a href="campaigns.html" class="text-sm text-indigo-600 hover:text-indigo-800 font-semibold">View All Campaigns →</a>
            <button @click="logout" class="text-sm text-red-600 hover:text-red-800 font-semibold">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-8 max-w-7xl mx-auto">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Welcome back!</h2>
            <p class="text-gray-600 mt-1">Here's an overview of your email campaigns performance.</p>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 rounded-lg bg-indigo-100 flex items-center justify-center">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                    </div>
                    <span class="text-xs font-semibold text-green-600 bg-green-100 px-2 py-1 rounded-full">Active</span>
                </div>
                <h3 class="text-3xl font-bold text-gray-900" x-text="totalCampaigns">-</h3>
                <p class="text-sm text-gray-600 mt-2">Total Campaigns</p>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 rounded-lg bg-purple-100 flex items-center justify-center">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <span class="text-xs font-semibold text-blue-600 bg-blue-100 px-2 py-1 rounded-full">Real-time</span>
                </div>
                <h3 class="text-3xl font-bold text-gray-900" x-text="totalEmailsSent">-</h3>
                <p class="text-sm text-gray-600 mt-2">Emails Sent</p>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 rounded-lg bg-green-100 flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                    </div>
                    <span class="text-xs font-semibold text-green-600 bg-green-100 px-2 py-1 rounded-full" x-text="avgReplyRate + '%'">0%</span>
                </div>
                <h3 class="text-3xl font-bold text-gray-900" x-text="avgReplyRate">-</h3>
                <p class="text-sm text-gray-600 mt-2">Avg Reply Rate</p>
            </div>
        </div>

        <!-- Recent Campaigns Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-900">Recent Campaigns</h3>
                <a href="campaigns.html" class="text-sm text-indigo-600 hover:text-indigo-800 font-semibold">View All →</a>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                        <tr>
                            <th class="px-6 py-3">Campaign Name</th>
                            <th class="px-6 py-3">Status</th>
                            <th class="px-6 py-3">Created</th>
                            <th class="px-6 py-3">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        <template x-if="loading">
                            <tr>
                                <td colspan="4" class="px-6 py-12 text-center">
                                    <div class="flex flex-col items-center justify-center">
                                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-3"></div>
                                        <p class="text-gray-500 text-sm">Loading campaigns...</p>
                                    </div>
                                </td>
                            </tr>
                        </template>
                        <template x-if="!loading && campaigns.length === 0">
                            <tr>
                                <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                                    <p>No campaigns yet. <a href="campaigns.html" class="text-indigo-600 hover:text-indigo-800 font-semibold">Create your first campaign</a></p>
                                </td>
                            </tr>
                        </template>
                        <template x-for="campaign in campaigns.slice(0, 5)" :key="campaign.id">
                            <tr class="hover:bg-gray-50 transition">
                                <td class="px-6 py-4 font-medium text-gray-900" x-text="campaign.name"></td>
                                <td class="px-6 py-4">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" 
                                          :class="campaign.status === 'draft' ? 'bg-gray-100 text-gray-700' : 'bg-green-100 text-green-700'" 
                                          x-text="campaign.status"></span>
                                </td>
                                <td class="px-6 py-4 text-gray-500" x-text="new Date(campaign.created_at).toLocaleDateString()"></td>
                                <td class="px-6 py-4">
                                    <a :href="'prospects.html?campaign=' + campaign.id" class="text-indigo-600 hover:text-indigo-800 font-semibold text-sm">Manage →</a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="assets/js/toast.js"></script>
    <script>
        function dashboardApp() {
            return {
                campaigns: [],
                totalCampaigns: 0,
                totalEmailsSent: 0,
                avgReplyRate: 0,
                loading: true,

                async init() {
                    const token = localStorage.getItem('token');
                    if (!token) { 
                        window.location.href = 'login.html'; 
                        return; 
                    }
                    await this.loadDashboard(token);
                },

                async loadDashboard(token) {
                    try {
                        const res = await fetch('http://127.0.0.1:8000/campaigns', { 
                            headers: { 'Authorization': `Bearer ${token}` } 
                        });
                        if (res.status === 401) { 
                            localStorage.removeItem('token'); 
                            window.location.href = 'login.html'; 
                            return; 
                        }
                        this.campaigns = await res.json();
                        this.totalCampaigns = this.campaigns.length;
                        // Stats sederhana (bisa dikembangkan dengan endpoint analytics)
                        this.totalEmailsSent = 0; 
                        this.avgReplyRate = 0;
                    } catch (e) { 
                        console.error(e);
                        toast.error('Failed to load dashboard data');
                    }
                    finally { 
                        this.loading = false; 
                    }
                },

                logout() {
                    localStorage.removeItem('token');
                    toast.info('Logged out successfully');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 500);
                }
            }
        }
    </script>
</body>
</html>
