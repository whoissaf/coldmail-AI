name: ColdGenius AI CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # GitHub menyediakan server cloud gratis untuk ini
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Tambahkan pytest untuk testing otomatis di masa depan
        pip install pytest httpx

    - name: Lint with flake8 (Cek error sintaks dasar)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Build Docker image
      run: docker build -t coldgenius-ai-backend .

    - name: Run basic health check in Docker
      run: |
        # Jalankan container di background
        docker run -d --name test-container -p 8000:8000 coldgenius-ai-backend
        # Tunggu sebentar agar server siap
        sleep 5
        # Tes endpoint root
        curl -f http://localhost:8000/ || exit 1
        # Bersihkan container
        docker stop test-container
        docker rm test-container
